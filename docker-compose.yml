services:

  db:
    image: mysql:8.0
    container_name: fiscalaudit-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-fiscalaudit}
      MYSQL_DATABASE: ${DB_NAME:-fiscalaudit}
      MYSQL_USER: ${DB_USER:-fiscalaudit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fiscalaudit}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-fiscalaudit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: fiscalaudit-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fiscalaudit}
      DB_USER: ${DB_USER:-fiscalaudit}
      DB_PASSWORD: ${DB_PASSWORD:-fiscalaudit}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
